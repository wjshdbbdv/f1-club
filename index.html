<!DOCTYPE html>
<html lang="ru">
<head>

            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ff0000;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .container {
            padding: 50px 20px;
        }
        h1 {

            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #bbbbbb;
            max-width: 600px;
            margin: 0 auto 30px auto;

        .btn {
            background-color: #ff0000;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;

            transition: 0.3s;

        <a href="#" class="btn">ЗАБРОНИРОВАТЬ КОКПИТ</a>

</html>
